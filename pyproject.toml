[project]
name = "openshell-teams"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "patkraw", email = "pkrawczuk@nvidia.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.142.4",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "httpx>=0.28.1",
    "protobuf>=7.36.2",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
