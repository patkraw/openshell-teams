# The lead may reach the board (rules added by Channel Guard) and ask Spawn Gate for workers.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /var/log, /proc, /dev/urandom]
  read_write: [/tmp, /dev/null]
network_policies:
  spawn:
    name: spawn
    endpoints:
      - host: host.openshell.internal
        port: 8766
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/agents" }
    binaries: [{ path: /usr/bin/bash }]
